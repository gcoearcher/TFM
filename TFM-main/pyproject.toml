[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nofanalyzers"
version = "0.0.1"
description = "Treball de fi de master"
authors = [
  { name = "Fanalyzers" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.9.0"


[tool.ruff]
line-length = 99
src = ["nofanalyzers"]
include = ["pyproject.toml", "nofanalyzers/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nofanalyzers"]
force-sort-within-sections = true

